<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>TENKAICHI｜専門家とつながる知識サービス</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#070d09;--ink:#e4ffe9;--muted:#8ba995;--line:#173321;--accent:#39ff75;--accent-soft:#06180c;--user:#0b2412;--shadow:0 8px 28px #0008}
*{box-sizing:border-box}html,body{min-height:100%;background:#000}body{margin:0;background:#000;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:18px}.matrix-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.78}.app{position:relative;z-index:1}
.app{max-width:820px;min-height:100vh;margin:auto;padding:20px 16px 30px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:.02em}.orb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:18px}
.header-actions{display:flex;gap:8px}button{font:inherit;cursor:pointer}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 11px;font-size:13px}
.intro{padding:28px 4px 18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--accent);margin:0 0 9px}.intro h1{font-size:28px;line-height:1.4;margin:0 0 8px}.intro p{font-size:15px;line-height:1.8;color:var(--muted);margin:0}
.notice{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 13px;color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 16px}
.chat{flex:1;display:flex;flex-direction:column;gap:14px;padding:4px 0 18px}
.welcome{padding:18px;border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:var(--shadow)}
.welcome strong{display:block;font-size:18px;margin-bottom:7px}.welcome p{font-size:17px;line-height:1.8;color:var(--muted);margin:0}
.message{display:flex;flex-direction:column;gap:5px;max-width:88%;align-self:flex-start}.message.user{align-self:flex-end;align-items:flex-end}
.speaker{font-size:14px;font-weight:700;color:var(--muted);padding:0 4px}.bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:14px 16px;font-size:18px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow)}.bubble a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-weight:600}.bubble a:hover{opacity:.8}.bubble a.citation-link{font-weight:800;text-decoration:none;padding:0 1px}.references{margin-top:7px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:16px;overflow:hidden}.references summary{cursor:pointer;padding:9px 11px;color:var(--muted);font-weight:700}.references ol{margin:0;padding:0 14px 10px 34px}.references li{padding:3px 0;line-height:1.6}.references a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.user .bubble{background:var(--user);border-color:transparent;border-radius:14px 14px 4px 14px}
.message-tools{display:flex;gap:6px}.copy-btn{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:5px 7px}
.composer{position:sticky;bottom:0;background:var(--bg);padding:12px 0 max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.composer-box{display:flex;gap:9px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:9px;box-shadow:var(--shadow)}
textarea{flex:1;resize:vertical;min-height:46px;max-height:160px;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;line-height:1.6;padding:9px}
.send{flex:0 0 46px;width:46px;height:46px;border:0;border-radius:50%;background:var(--accent);color:white;font-size:27px;line-height:1;font-weight:700;padding:0;display:grid;place-items:center}.send:disabled{opacity:.5;cursor:wait}
.hint{font-size:10px;color:var(--muted);margin:7px 4px 0}
footer{text-align:center;color:var(--muted);font-size:10px;padding:14px 0 0}

/* Preserve the original outward bottom/right glass faces.
   Add matching inset faces only along the top and left. */
.notice,.welcome,.bubble,.references,.composer-box,.icon-btn{
  position:relative;
  border:1px solid rgba(235,255,241,.82) !important;
  border-radius:0 !important;
  /* Frosted glass sits above the colored shadow layer. */
  background-color:rgba(12,28,17,.30) !important;
  -webkit-backdrop-filter:blur(12px) saturate(125%) !important;
  backdrop-filter:blur(12px) saturate(125%) !important;
  /* A soft, green-tinted inner shadow echoes the existing bottom/right faces. */
  background-image:none !important;
  box-shadow:inset 7px 7px 9px rgba(116,151,126,.42) !important;
}
/* Original outward bottom and right faces: unchanged. */
.notice,.welcome,.bubble,.references,.composer-box{
  overflow:visible;
  margin-right:8px;
  margin-bottom:8px;
}
.notice:before,.welcome:before,.bubble:before,.composer-box:before{
  content:"";
  position:absolute;
  z-index:-1;
  left:5px;
  right:-8px;
  bottom:-8px;
  height:8px;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(116,151,126,.78),rgba(39,65,47,.96));
  clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,8px 100%);
}
.notice:after,.welcome:after,.bubble:after,.composer-box:after{
  content:"";
  position:absolute;
  z-index:-1;
  top:5px;
  right:-8px;
  bottom:-8px;
  width:8px;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(103,139,113,.82),rgba(31,52,38,.98));
  clip-path:polygon(0 0,100% 8px,100% calc(100% - 8px),0 100%);
}
.user .bubble{
  background-color:rgba(10,38,19,.30) !important;
  border-color:rgba(235,255,241,.82) !important;
}
.composer{
  background:rgba(0,0,0,.10) !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}
@media(min-width:600px){.app{padding:24px 28px 36px}.intro h1{font-size:31px}.intro{padding-top:34px}}

.character-stage{height:360px;display:flex;align-items:center;justify-content:center;padding:8px 0 18px;overflow:hidden}.character-stage img{display:block;height:100%;max-width:100%;width:auto;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}@media(max-width:599px){.character-stage{height:310px;padding:4px 0 14px}}\n
/* Character transfer demo */
.character-console{padding:8px 0 18px}
.character-stage{height:390px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate}
.character{position:absolute;display:flex;align-items:center;justify-content:center;transition:transform .85s cubic-bezier(.2,.8,.2,1),opacity .55s ease,filter .7s ease;will-change:transform,opacity}
.character img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 12px 20px rgba(0,0,0,.72))}
.dende-character{width:76%;height:94%;left:12%;bottom:0;transform:translateX(0) scale(1);transform-origin:center bottom;z-index:2}
.vegeta-character{width:68%;height:100%;right:-18%;bottom:0;opacity:0;transform:translateX(24%) scale(.72);filter:brightness(1.5) saturate(1.2);z-index:3}
.character-stage.expert-mode .dende-character{left:0;transform:translateX(-3%) scale(.52);transform-origin:left bottom}
.character-stage.expert-mode .vegeta-character{right:3%;opacity:1;transform:translateX(0) scale(1);filter:brightness(1) saturate(1)}
.digital-surge{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(35,255,112,.18) 14px,transparent 16px),radial-gradient(ellipse at 78% 55%,rgba(30,255,105,.36),transparent 48%);mix-blend-mode:screen}
.character-stage.expert-mode .digital-surge{animation:transfer-flash 1.15s ease-out both}
@keyframes transfer-flash{0%{opacity:0;filter:blur(14px);transform:scaleX(.2)}25%{opacity:1;filter:blur(2px);transform:scaleX(1.2)}65%{opacity:.55;filter:blur(5px)}100%{opacity:.12;filter:blur(9px)}}
.arrival-label{position:absolute;top:10px;left:12px;z-index:5;display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid rgba(100,255,150,.4);background:rgba(0,10,4,.68);color:#8affad;font:700 10px/1.2 ui-monospace,monospace;letter-spacing:.12em;backdrop-filter:blur(8px)}
.status-dot{width:7px;height:7px;border-radius:50%;background:#49ff83;box-shadow:0 0 10px #49ff83}
.character-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 4px 12px}
.character-controls button{border:1px solid rgba(100,255,150,.55);background:rgba(3,22,10,.8);color:#baffca;padding:10px 15px;font-size:14px;font-weight:700;letter-spacing:.03em;box-shadow:0 0 18px rgba(35,255,112,.12);cursor:pointer}
.character-controls button:hover{background:rgba(12,55,26,.92);box-shadow:0 0 22px rgba(35,255,112,.28)}
.character-controls span{font-size:11px;color:var(--muted)}
body.matrix-boost .matrix-bg{opacity:1}
@media(max-width:599px){.character-stage{height:310px}.dende-character{width:82%;height:92%;left:9%}.character-stage.expert-mode .dende-character{transform:translateX(-4%) scale(.48)}.vegeta-character{width:72%}.character-stage.expert-mode .vegeta-character{right:0}.arrival-label{top:7px;left:6px}}
@media(prefers-reduced-motion:reduce){.character,.digital-surge{animation:none!important;transition:none!important}}

/* Materialize the expert from Matrix data instead of sliding in */
.character-stage.teleporting .digital-surge{opacity:1;animation:matrix-gather 1.65s ease-out both}
.character-stage.teleporting .digital-surge:before{content:"";position:absolute;left:63%;top:52%;width:min(46vw,330px);aspect-ratio:1;border:2px solid rgba(108,255,160,.9);border-radius:50%;transform:translate(-50%,-50%) scale(.08);box-shadow:0 0 14px #39ff75,inset 0 0 22px rgba(57,255,117,.6);animation:arrival-ring 1.15s cubic-bezier(.12,.72,.2,1) both}
.character-stage.teleporting .digital-surge:after{content:"";position:absolute;left:63%;top:52%;width:min(34vw,245px);aspect-ratio:1;border:1px solid rgba(190,255,210,.9);border-radius:50%;transform:translate(-50%,-50%) scale(.05);box-shadow:0 0 30px 12px rgba(57,255,117,.45);animation:arrival-ring 1.35s .12s cubic-bezier(.12,.72,.2,1) both}
.character-stage.teleporting .vegeta-character{animation:teleport-materialize 1.55s cubic-bezier(.16,.8,.2,1) both;transition:none}
.character-stage.teleporting .dende-character{filter:brightness(1.18) drop-shadow(0 0 12px rgba(57,255,117,.55))}
@keyframes matrix-gather{0%{opacity:0;filter:blur(18px);transform:scale(.35)}18%{opacity:1;filter:blur(2px);transform:scale(1.08)}55%{opacity:.9;filter:blur(1px);transform:scale(1)}100%{opacity:.18;filter:blur(5px);transform:scale(1.12)}}
@keyframes arrival-ring{0%{opacity:0;transform:translate(-50%,-50%) scale(.06)}18%{opacity:1}72%{opacity:.8}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
@keyframes teleport-materialize{0%{opacity:0;transform:translateX(0) scale(.12);filter:brightness(4) saturate(2) blur(22px);clip-path:inset(48% 48% 48% 48%)}24%{opacity:.95;transform:translateX(0) scale(.62);filter:brightness(2.8) saturate(1.8) blur(8px);clip-path:inset(8% 12% 10% 12%)}42%{opacity:.35;transform:translateX(0) scale(.78);filter:brightness(3) blur(13px);clip-path:inset(0 0 0 0)}61%{opacity:1;transform:translateX(0) scale(1.04);filter:brightness(1.9) blur(2px);clip-path:inset(0 0 0 0)}78%{opacity:.72;transform:translateX(0) scale(.99);filter:brightness(1.4) blur(4px)}100%{opacity:1;transform:translateX(0) scale(1);filter:brightness(1) saturate(1) blur(0);clip-path:inset(0 0 0 0)}}
@media(max-width:599px){.character-stage.teleporting .digital-surge:before,.character-stage.teleporting .digital-surge:after{left:64%}}
@media(prefers-reduced-motion:reduce){.character-stage.teleporting .vegeta-character,.character-stage.teleporting .digital-surge,.character-stage.teleporting .digital-surge:before,.character-stage.teleporting .digital-surge:after{animation:none!important}}


/* Keep the character area fixed while only the conversation scrolls */
html,body{height:100%;overflow:hidden}
.app{height:100vh;height:100dvh;min-height:0;overflow:hidden}
header{flex:0 0 auto}
.character-console{flex:0 0 auto;padding:4px 0 8px}
.character-stage{height:250px;padding:0;flex:0 0 auto}
.character-controls{padding-bottom:8px}
.chat{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 4px 18px 0;scrollbar-width:thin;scrollbar-color:rgba(57,255,117,.45) transparent}
.composer{position:relative;flex:0 0 auto;bottom:auto}
footer{display:none}
@media(max-width:599px){
  .app{padding:10px 12px max(8px,env(safe-area-inset-bottom))}
  header{padding-bottom:10px}
  .character-console{padding:2px 0 5px}
  .character-stage{height:190px}
  .character-controls{gap:8px;padding-bottom:5px}
  .character-controls button{padding:8px 12px}
  .chat{padding-top:3px}
}


/* Speaker portraits: tight face crops inside circular frames */
.message{
  display:grid;
  grid-template-columns:46px minmax(0,1fr);
  grid-template-areas:"avatar speaker" "avatar bubble" "avatar refs" "avatar tools";
  column-gap:10px;
  row-gap:4px;
  max-width:92%;
  align-self:flex-start;
}
.message-avatar{
  grid-area:avatar;
  width:46px;
  height:46px;
  border-radius:50%;
  overflow:hidden;
  display:grid;
  place-items:center;
  align-self:start;
  margin-top:2px;
  border:1px solid rgba(92,255,139,.78);
  background:radial-gradient(circle at 50% 35%,rgba(30,95,49,.65),rgba(0,8,3,.96));
  box-shadow:0 0 12px rgba(57,255,117,.18),inset 0 0 8px rgba(57,255,117,.16);
  color:#baffca;
  font-size:21px;
}
.message-avatar img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 12%;
  transform:scale(2.15);
}
.message .speaker{grid-area:speaker;padding:0 3px}
.message .bubble{grid-area:bubble;min-width:0}
.message .references{grid-area:refs}
.message .message-tools{grid-area:tools}
.message.user{
  grid-template-columns:minmax(0,1fr) 46px;
  grid-template-areas:"speaker avatar" "bubble avatar";
  align-self:flex-end;
  align-items:initial;
}
.message.user .speaker{text-align:right}
.message.user .message-avatar{
  grid-area:avatar;
  border-color:rgba(130,190,255,.7);
  background:radial-gradient(circle at 50% 35%,rgba(28,60,92,.75),rgba(0,5,12,.96));
  color:#d5eaff;
  box-shadow:0 0 12px rgba(100,170,255,.16);
}
@media(max-width:599px){
  .message{grid-template-columns:40px minmax(0,1fr);column-gap:8px;max-width:96%}
  .message-avatar{width:40px;height:40px}
  .message.user{grid-template-columns:minmax(0,1fr) 40px}
}


/* Dende's face is toward the upper-right of the source image.
   Shift the crop window right and upward, and keep the portrait slightly smaller. */
.message-avatar img[src*="dende.png"]{
  /* The head is in the upper-middle/right of the full illustration.
     Zoom into that area so the circular avatar shows the face, not the shell or robe. */
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:68% 20%;
  transform:scale(1.08);
  transform-origin:68% 20%;
}

</style>
</head>
<body>
<canvas class="matrix-bg" id="matrix-bg" aria-hidden="true"></canvas>
<main class="app">
<header><div class="brand"><span class="orb" aria-hidden="true">✦</span>TENKAICHI</div></header>
<section class="character-console" id="character-console" aria-label="専門家キャラクター表示">
  <div class="character-stage" id="character-stage">
    <div class="digital-surge" aria-hidden="true"></div>
    <div class="character dende-character"><img src="images/dende.png" alt="案内役デンデ"></div>
    <div class="character vegeta-character"><img src="images/vegeta_transparent_final.png" alt="専門家ベジータ"></div>
    <div class="arrival-label" aria-live="polite"><span class="status-dot"></span><span id="character-status">DENDE / GUIDE</span></div>
  </div>
  <div class="character-controls"><button type="button" id="expert-toggle" aria-pressed="false">ベジータを呼び出す</button><span>※ 表示演出の確認用デモ</span></div>
  </section>
<section class="chat" id="chat" aria-live="polite"><div class="message"><div class="message-avatar" aria-hidden="true"><img src="images/dende.png" alt=""></div><div class="speaker">デンデ</div><div class="bubble">こんにちは。デンデです。
知りたいことをそのまま入力してください。質問に応じて、必要な専門家を呼び出してお手伝いします。</div></div></section>
<form class="composer" id="chat-form"><div class="composer-box"><textarea id="message-input" rows="1" maxlength="2000" placeholder="質問を入力…" aria-label="質問を入力"></textarea><button class="send" id="send-button" type="submit" aria-label="送信">↑</button></div></form>
<footer>TENKAICHI · 専門家たちが集う知識プラットフォーム</footer>
</main>
<script>
const chat=document.getElementById("chat");const form=document.getElementById("chat-form");const input=document.getElementById("message-input");const send=document.getElementById("send-button");
const matrix=document.getElementById("matrix-bg");const ctx=matrix.getContext("2d");let columns=[],width=0,height=0,frame=0,matrixBoost=false;
function makeMatrixColumn(){const length=Math.random()<.28?Math.floor(5+Math.random()*10):1;return{y:-Math.random()*height-length*24,speed:4+Math.random()*9,trail:Array.from({length},()=>Math.random()<.5?"0":"1")};}
function resizeMatrix(){const ratio=Math.min(window.devicePixelRatio||1,1.5);width=window.innerWidth;height=window.innerHeight;matrix.width=Math.floor(width*ratio);matrix.height=Math.floor(height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);const count=Math.ceil(width/28);columns=Array.from({length:count},()=>makeMatrixColumn());}
function drawMatrix(){ctx.fillStyle="rgba(0,0,0,0.22)";ctx.fillRect(0,0,width,height);ctx.font='22px "SFMono-Regular",Consolas,monospace';for(let i=0;i<columns.length;i++){const col=columns[i];for(let j=0;j<col.trail.length;j++){const alpha=Math.max(.12,.78-j*.055);ctx.fillStyle="rgba(45,255,105,"+alpha+")";ctx.fillText(col.trail[j],i*28,col.y+j*24);}col.y+=col.speed*(matrixBoost?2.15:1);if(col.y>height+col.trail.length*24){columns[i]=makeMatrixColumn();}}if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches)frame=requestAnimationFrame(drawMatrix);}
resizeMatrix();if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ctx.fillStyle="#000";ctx.fillRect(0,0,width,height);for(let i=0;i<columns.length;i++){ctx.fillStyle="rgba(45,255,105,.22)";ctx.font='24px monospace';ctx.fillText(Math.random()<.5?"0":"1",i*28,Math.random()*height);}}else drawMatrix();window.addEventListener("resize",()=>{cancelAnimationFrame(frame);resizeMatrix();drawMatrix();});


function renderMessageContent(bubble,text,details){const pattern=/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)|\[(\d+)\]/g;let lastIndex=0;for(const match of text.matchAll(pattern)){const index=match.index;if(index>lastIndex)bubble.append(document.createTextNode(text.slice(lastIndex,index)));const link=document.createElement("a");if(match[2]){link.textContent=match[1];link.href=match[2];link.target="_blank";link.rel="noopener noreferrer";}else{const number=Number(match[3]);link.textContent="["+number+"]";link.className="citation-link";link.href="#reference-"+number;link.addEventListener("click",event=>{const target=details?.querySelector("#reference-"+number);if(target){event.preventDefault();details.open=true;target.scrollIntoView({behavior:"smooth",block:"center"});}});}bubble.append(link);lastIndex=index+match[0].length;}if(lastIndex<text.length)bubble.append(document.createTextNode(text.slice(lastIndex)));}function createSpeakerAvatar(speaker,isUser){
  const avatar=document.createElement("div");
  avatar.className="message-avatar";
  avatar.setAttribute("aria-hidden","true");
  if(isUser){avatar.textContent="👤";return avatar;}
  let src=null;
  if(String(speaker).includes("ベジータ"))src="images/vegeta_transparent_final.png";
  else if(String(speaker).includes("デンデ"))src="images/dende.png";
  if(src){const img=document.createElement("img");img.src=src;img.alt="";avatar.append(img);}
  else avatar.textContent="✦";
  return avatar;
}
function addMessage(speaker,text,isUser=false,sources=[]){
  const wrap=document.createElement("div");
  wrap.className="message"+(isUser?" user":"");
  const avatar=createSpeakerAvatar(speaker,isUser);
  const label=document.createElement("div");
  label.className="speaker";
  label.textContent=speaker;
  const bubble=document.createElement("div");
  bubble.className="bubble";
  const refs=!isUser?(sources||[]).filter(source=>source&&source.url&&((source.sourceType==="expert"&&source.read===true&&source.hasBody===true)||(source.sourceType==="exa"&&source.referenceable===true))):[];
  let details=null;
  if(refs.length){
    details=document.createElement("details");
    details.className="references";
    const summary=document.createElement("summary");
    summary.textContent="参照した記事（"+refs.length+"件）";
    const list=document.createElement("ol");
    list.style.listStyle="none";
    for(let index=0;index<refs.length;index++){
      const source=refs[index];
      const item=document.createElement("li");
      item.id="reference-"+(index+1);
      const link=document.createElement("a");
      link.href=source.url;
      link.target="_blank";
      link.rel="noopener noreferrer";
      link.textContent=source.title||source.url;
      item.append(document.createTextNode("["+(index+1)+"] "),link);
      list.append(item);
    }
    details.append(summary,list);
  }
  renderMessageContent(bubble,String(text||""),details);
  wrap.append(avatar,label,bubble);
  if(details)wrap.append(details);
  if(!isUser){
    const tools=document.createElement("div");
    tools.className="message-tools";
    const copy=document.createElement("button");
    copy.type="button";
    copy.className="copy-btn";
    copy.textContent="⧉";
    copy.setAttribute("aria-label","回答をコピー");
    copy.title="回答をコピー";
    copy.addEventListener("click",async()=>{
      try{await navigator.clipboard.writeText(text);copy.textContent="コピーしました";}
      catch{copy.textContent="コピーできませんでした";}
    });
    tools.append(copy);
    wrap.append(tools);
  }
  chat.append(wrap);
  wrap.scrollIntoView({behavior:"smooth",block:"nearest"});
}

</script>

<script>
/* Independent, defensive character-demo and Matrix controller */
(function(){
  function initTenkaichiDemo(){
    const stage=document.getElementById('character-stage');
    const button=document.getElementById('expert-toggle');
    const status=document.getElementById('character-status');
    if(!stage||!button||!status) return;
    if(button.dataset.bound==='1') return;
    button.dataset.bound='1';
    let active=false;
    button.addEventListener('click',function(){
      active=!active;
      stage.classList.toggle('expert-mode',active);
      stage.classList.remove('teleporting');
      if(active){
        void stage.offsetWidth;
        stage.classList.add('teleporting');
        window.setTimeout(()=>stage.classList.remove('teleporting'),1700);
      }
      matrixBoost=active;
      document.body.classList.toggle('matrix-boost',active);
      button.setAttribute('aria-pressed',String(active));
      button.textContent=active?'デンデに戻す':'ベジータを呼び出す';
      status.textContent=active?'VEGETA / EXPERT CONNECTED':'DENDE / GUIDE';
      document.documentElement.classList.toggle('expert-mode-active',active);
      const canvas=document.getElementById('matrix-bg');
      if(canvas) canvas.style.opacity=active?'1':'.78';
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initTenkaichiDemo);
  else initTenkaichiDemo();
})();
</script>
