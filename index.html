<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>TENKAICHI｜専門家とつながる知識サービス</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#070d09;--ink:#e4ffe9;--muted:#8ba995;--line:#173321;--accent:#39ff75;--accent-soft:#06180c;--user:#0b2412;--shadow:0 8px 28px #0008}
*{box-sizing:border-box}html,body{min-height:100%;background:#000}body{margin:0;background:#000;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:18px}.matrix-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.78}.app{position:relative;z-index:1}
.app{max-width:820px;min-height:100vh;margin:auto;padding:20px 16px 30px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:.02em}.orb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:18px}
.header-actions{display:flex;gap:8px}button{font:inherit;cursor:pointer}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 11px;font-size:13px}
.intro{padding:28px 4px 18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--accent);margin:0 0 9px}.intro h1{font-size:28px;line-height:1.4;margin:0 0 8px}.intro p{font-size:15px;line-height:1.8;color:var(--muted);margin:0}
.notice{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 13px;color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 16px}
.chat{flex:1;display:flex;flex-direction:column;gap:14px;padding:4px 0 18px}
.welcome{padding:18px;border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:var(--shadow)}
.welcome strong{display:block;font-size:18px;margin-bottom:7px}.welcome p{font-size:17px;line-height:1.8;color:var(--muted);margin:0}
.message{display:flex;flex-direction:column;gap:5px;max-width:88%;align-self:flex-start}.message.user{align-self:flex-end;align-items:flex-end}
.speaker{font-size:14px;font-weight:700;color:var(--muted);padding:0 4px}.bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:14px 16px;font-size:18px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow)}.bubble a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-weight:600}.bubble a:hover{opacity:.8}.bubble a.citation-link{font-weight:800;text-decoration:none;padding:0 1px}.references{margin-top:7px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:16px;overflow:hidden}.references summary{cursor:pointer;padding:9px 11px;color:var(--muted);font-weight:700}.references ol{margin:0;padding:0 14px 10px 34px}.references li{padding:3px 0;line-height:1.6}.references a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.user .bubble{background:var(--user);border-color:transparent;border-radius:14px 14px 4px 14px}
.message-tools{display:flex;gap:6px}.copy-btn{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:5px 7px}
.composer{position:sticky;bottom:0;background:var(--bg);padding:12px 0 max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.composer-box{display:flex;gap:9px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:9px;box-shadow:var(--shadow)}
textarea{flex:1;resize:vertical;min-height:46px;max-height:160px;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;line-height:1.6;padding:9px}
.send{flex:0 0 46px;width:46px;height:46px;border:0;border-radius:50%;background:var(--accent);color:white;font-size:27px;line-height:1;font-weight:700;padding:0;display:grid;place-items:center}.send:disabled{opacity:.5;cursor:wait}
.hint{font-size:10px;color:var(--muted);margin:7px 4px 0}
footer{text-align:center;color:var(--muted);font-size:10px;padding:14px 0 0}

/* Preserve the original outward bottom/right glass faces.
   Add matching inset faces only along the top and left. */
.notice,.welcome,.bubble,.references,.composer-box,.icon-btn{
  position:relative;
  border:1px solid rgba(235,255,241,.82) !important;
  border-radius:0 !important;
  /* Frosted glass sits above the colored shadow layer. */
  background-color:rgba(12,28,17,.30) !important;
  -webkit-backdrop-filter:blur(12px) saturate(125%) !important;
  backdrop-filter:blur(12px) saturate(125%) !important;
  /* A soft, green-tinted inner shadow echoes the existing bottom/right faces. */
  background-image:none !important;
  box-shadow:inset 7px 7px 9px rgba(116,151,126,.42) !important;
}
/* Original outward bottom and right faces: unchanged. */
.notice,.welcome,.bubble,.references,.composer-box{
  overflow:visible;
  margin-right:8px;
  margin-bottom:8px;
}
.notice:before,.welcome:before,.bubble:before,.composer-box:before{
  content:"";
  position:absolute;
  z-index:-1;
  left:5px;
  right:-8px;
  bottom:-8px;
  height:8px;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(116,151,126,.78),rgba(39,65,47,.96));
  clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,8px 100%);
}
.notice:after,.welcome:after,.bubble:after,.composer-box:after{
  content:"";
  position:absolute;
  z-index:-1;
  top:5px;
  right:-8px;
  bottom:-8px;
  width:8px;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(103,139,113,.82),rgba(31,52,38,.98));
  clip-path:polygon(0 0,100% 8px,100% calc(100% - 8px),0 100%);
}
.user .bubble{
  background-color:rgba(10,38,19,.30) !important;
  border-color:rgba(235,255,241,.82) !important;
}
.composer{
  background:rgba(0,0,0,.10) !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}
@media(min-width:600px){.app{padding:24px 28px 36px}.intro h1{font-size:31px}.intro{padding-top:34px}}
\n.character-stage{height:360px;display:flex;align-items:center;justify-content:center;padding:8px 0 18px;overflow:hidden}.character-stage img{display:block;height:100%;max-width:100%;width:auto;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}@media(max-width:599px){.character-stage{height:310px;padding:4px 0 14px}}\n</style>
</head>
<body>
<canvas class="matrix-bg" id="matrix-bg" aria-hidden="true"></canvas>
<main class="app">
<header><div class="brand"><span class="orb" aria-hidden="true">✦</span>TENKAICHI</div></header>
<section class="character-stage" aria-label="TENKAICHIの案内役デンデ"><img src="images/dende.png" alt="TENKAICHIの案内役デンデ" onerror="this.parentElement.hidden=true"></section>
<section class="chat" id="chat" aria-live="polite"><div class="welcome"><strong>こんにちは。デンデです。</strong><p>知りたいことをそのまま入力してください。質問に応じてデンデが必要な専門知識や道具を選ぶ仕組みです。</p></div></section>
<form class="composer" id="chat-form"><div class="composer-box"><textarea id="message-input" rows="1" maxlength="2000" placeholder="質問を入力…" aria-label="質問を入力"></textarea><button class="send" id="send-button" type="submit" aria-label="送信">↑</button></div></form>
<footer>TENKAICHI · 専門家たちが集う知識プラットフォーム</footer>
</main>
<script>
const chat=document.getElementById("chat");const form=document.getElementById("chat-form");const input=document.getElementById("message-input");const send=document.getElementById("send-button");
const matrix=document.getElementById("matrix-bg");const ctx=matrix.getContext("2d");let columns=[],width=0,height=0,frame=0;
function makeMatrixColumn(){const length=Math.random()<.28?Math.floor(5+Math.random()*10):1;return{y:-Math.random()*height-length*24,speed:4+Math.random()*9,trail:Array.from({length},()=>Math.random()<.5?"0":"1")};}
function resizeMatrix(){const ratio=Math.min(window.devicePixelRatio||1,1.5);width=window.innerWidth;height=window.innerHeight;matrix.width=Math.floor(width*ratio);matrix.height=Math.floor(height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);const count=Math.ceil(width/28);columns=Array.from({length:count},()=>makeMatrixColumn());}
function drawMatrix(){ctx.fillStyle="rgba(0,0,0,0.22)";ctx.fillRect(0,0,width,height);ctx.font='22px "SFMono-Regular",Consolas,monospace';for(let i=0;i<columns.length;i++){const col=columns[i];for(let j=0;j<col.trail.length;j++){const alpha=Math.max(.12,.78-j*.055);ctx.fillStyle="rgba(45,255,105,"+alpha+")";ctx.fillText(col.trail[j],i*28,col.y+j*24);}col.y+=col.speed;if(col.y>height+col.trail.length*24){columns[i]=makeMatrixColumn();}}if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches)frame=requestAnimationFrame(drawMatrix);}
resizeMatrix();if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ctx.fillStyle="#000";ctx.fillRect(0,0,width,height);for(let i=0;i<columns.length;i++){ctx.fillStyle="rgba(45,255,105,.22)";ctx.font='24px monospace';ctx.fillText(Math.random()<.5?"0":"1",i*28,Math.random()*height);}}else drawMatrix();window.addEventListener("resize",()=>{cancelAnimationFrame(frame);resizeMatrix();drawMatrix();});
function renderMessageContent(bubble,text,details){const pattern=/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)|\[(\d+)\]/g;let lastIndex=0;for(const match of text.matchAll(pattern)){const index=match.index;if(index>lastIndex)bubble.append(document.createTextNode(text.slice(lastIndex,index)));const link=document.createElement("a");if(match[2]){link.textContent=match[1];link.href=match[2];link.target="_blank";link.rel="noopener noreferrer";}else{const number=Number(match[3]);link.textContent="["+number+"]";link.className="citation-link";link.href="#reference-"+number;link.addEventListener("click",event=>{const target=details?.querySelector("#reference-"+number);if(target){event.preventDefault();details.open=true;target.scrollIntoView({behavior:"smooth",block:"center"});}});}bubble.append(link);lastIndex=index+match[0].length;}if(lastIndex<text.length)bubble.append(document.createTextNode(text.slice(lastIndex)));}function addMessage(speaker,text,isUser=false,sources=[]){const wrap=document.createElement("div");wrap.className="message"+(isUser?" user":"");const label=document.createElement("div");label.className="speaker";label.textContent=speaker;const bubble=document.createElement("div");bubble.className="bubble";const refs=!isUser?(sources||[]).filter(source=>source&&source.url&&((source.sourceType==="expert"&&source.read===true&&source.hasBody===true)||(source.sourceType==="exa"&&source.referenceable===true))):[];let details=null;if(refs.length){details=document.createElement("details");details.className="references";const summary=document.createElement("summary");summary.textContent="参照した記事（"+refs.length+"件）";const list=document.createElement("ol");list.style.listStyle="none";for(let index=0;index<refs.length;index++){const source=refs[index];const item=document.createElement("li");item.id="reference-"+(index+1);const link=document.createElement("a");link.href=source.url;link.target="_blank";link.rel="noopener noreferrer";link.textContent=source.title||source.url;item.append(document.createTextNode("["+(index+1)+"] "),link);list.append(item)}details.append(summary,list)}renderMessageContent(bubble,String(text||""),details);wrap.append(label,bubble);if(details)wrap.append(details);if(!isUser){const tools=document.createElement("div");tools.className="message-tools";const copy=document.createElement("button");copy.type="button";copy.className="copy-btn";copy.textContent="⧉";copy.setAttribute("aria-label","回答をコピー");copy.title="回答をコピー";copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(text);copy.textContent="コピーしました"}catch{copy.textContent="コピーできませんでした"} });tools.append(copy);wrap.append(tools)}chat.append(wrap);wrap.scrollIntoView({behavior:"smooth",block:"nearest"})}
form.addEventListener("submit",(event)=>{event.preventDefault();const message=input.value.trim();if(!message||send.disabled)return;addMessage("あなた",message,true);input.value="";addMessage("TENKAICHI","現在は画面デザイン確認用のため、回答機能には接続していません。専門家との接続は今後実装します。");input.focus()});
</script>
</body>
</html>
